<html
    xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns="http://www.w3.org/1999/xhtml"
    lang="en"
    f:schemaLocation="https://fluidtypo3.org/schemas/fluid-master.xsd"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Default" />

<f:section name="Content">
    <h1>
        <f:translate extensionName="xlsimport" key="module_name"/> - <f:translate extensionName="xlsimport" key="prepare"/>
    </h1>
    <f:be.infobox state="-1" title="{f:translate(key:'prepareinfo', extensionName: 'xlsimport')}">
        <ol>
            <li>{f:translate(key: 'prepareinfo_text', extensionName: 'xlsimport')}</li>
            <li>{f:translate(key: 'importinfo_text', extensionName: 'xlsimport')}</li>
        </ol>
    </f:be.infobox>
    <form
        id="importData"
        method="post"
        enctype="multipart/form-data"
    >
        <input type="hidden" name="jsonFile" value="{jsonFile}">
        <input type="hidden" name="deleteRecords" value="{deleteRecords}">
        <f:for each="{passwordFields}" as="passwordField">
            <input type="hidden" name="passwordFields[]" value="{passwordField}">
        </f:for>
        <f:if condition="{hasPasswordField}">
            <fieldset class="form-section">
                <legend>{f:translate(key: 'multiple', extensionName: 'xlsimport')}</legend>
                <label for="overridePassword">
                    {f:translate(key: 'overridePassword', extensionName: 'xlsimport')}
                </label>
                <input id="overridePassword" name="passwordOverride" type="checkbox" value="1">
            </fieldset>
        </f:if>
        <f:comment><!--
    Disabled for the moment. This should be used for working with selects in TCA, but doesn't work properly
    -->
            <!--
        <f:for each="{fields}" as="field" key="fieldName">
            <f:if condition="{field.config.type} == 'select' || {field.config.type} == 'group'">
                <f:render partial="TcaField" arguments="{_all}"/>
            </f:if>
        </f:for>
        --></f:comment>
        <fieldset>
            <legend>
                <f:variable name="countData" value="{data -> f:count()}"/>
                <f:translate extensionName="xlsimport" key="info_complete"/>: <span class="counter">{countData}</span>/{countData}
                <f:if condition="{firstLineContainsFields}"> (<f:translate extensionName="xlsimport" key="skipfirstline">skip 1st line</f:translate>)
                </f:if>
            </legend>
            <p>
                <button class="btn btn-default" type="submit">{f:translate(key:'import', extensionName: 'xlsimport')}</button>
            </p>
            <input name="table" type="hidden" value="{table}">
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <td>
                        <f:translate extensionName="xlsimport" key="record"/>
                    </td>
                    <f:for as="row" each="{data}" iteration="i">
                        <f:if condition="{i.isFirst}">
                            <f:for as="value" each="{row}" iteration="it">
                                <td>
                                    <select name="fields[{it.cycle}]">
                                        <option value="">{f:translate(key: 'ignore', extensionName: 'xlsimport')}</option>
                                        <f:for as="field" each="{fields}">
                                            <option value="{field.type}"
                                                {f:if(condition: '{field.type} == {value} && {firstLineContainsFields}', then: ' selected')}
                                            >{field.label}</option>
                                        </f:for>
                                    </select>
                                </td>
                            </f:for>
                        </f:if>
                    </f:for>
                </tr>
                </thead>
                <tbody>
                <f:for each="{data}" as="row" key="number" iteration="i">
                    <f:if condition="{firstLineContainsFields} && {i.isFirst}">
                        <f:else>
                            <tr>
                                <td><input checked="true" class="count" name="dataset[{number}]" type="checkbox" value="1"></td>
                                <f:for as="value" each="{row}"> <td>{value}</td></f:for>
                            </tr>
                        </f:else>
                    </f:if>
                </f:for>
                </tbody>
            </table>
            <p>
                <button class="btn btn-default" type="submit">{f:translate(key:'import', extensionName: 'xlsimport')}</button>
            </p>
        </fieldset>
    </form>
</f:section>
</html>
